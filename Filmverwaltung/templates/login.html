<!DOCTYPE html>
<html lang="de">
<head>
    <title>Login - Mini Netflix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='m70_mini_netflix.css') }}">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}
        <form method="post">
            <label for="username">Benutzername:</label><br>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Passwort:</label><br>
            <input type="password" id="password" name="password" required><br><br>
            <button type="submit" class="btn">Login</button>
            <a href="{{ url_for('register') }}" class="btn" style="margin-left:10px; background:#ff4081; color:#fff;">Registrieren</a>
        </form>
    </div>
    <div class="footer-link">
        <a href="https://github.com/Leahcimkrob/umschulung/tree/main/Filmverwaltung" class="project-link" target="no_frame">🎬 Mini Netflix (Files im Github)</a>
    </div>
</body>
</html>
