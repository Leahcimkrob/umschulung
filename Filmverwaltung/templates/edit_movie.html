<!DOCTYPE html>
<html lang="de">
<head>
    <title>Film bearbeiten</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='m70_mini_netflix.css') }}">
</head>
<body>
    <div class="container">
        <h2>Film bearbeiten</h2>
        {% if error %}<p style="color:#ff4081;">{{ error }}</p>{% endif %}
        {% if success %}<p style="color:green;">{{ success }}</p>{% endif %}
        <form method="get" action="{{ url_for('edit_movie') }}">
            <label for="movie_id">Film auswählen:</label><br>
            <select name="movie_id" id="movie_id" onchange="this.form.submit()">
                <option value="">-- Bitte wählen --</option>
                {% for m in movies %}
                    <option value="{{ m[0] }}" {% if movie_id == m[0] %}selected{% endif %}>{{ m[1] }} ({{ m[2] }})</option>
                {% endfor %}
            </select>
        </form>
        {% if movie %}
        <form method="post" style="margin-top:16px;">
            <label for="title">Titel:</label><br>
            <input type="text" name="title" id="title" value="{{ movie[1] }}" required><br>
            <label for="genre">Genre:</label><br>
            <input type="text" name="genre" id="genre" value="{{ movie[2] }}" required><br>
            <button type="submit" class="btn">💾 Speichern</button>
            <a href="{{ url_for('show_movies') }}" class="btn">🛑 Abbrechen</a>
        </form>
        <form method="post" action="{{ url_for('delete_movie', movie_id=movie[0]) }}" style="margin-top:12px;">
            <button type="submit" class="btn" style="background:#ff4081;">🗑️ Film löschen</button>
        </form>
        {% endif %}
        <a href="{{ url_for('home') }}" class="btn">🏠 Home</a>
    </div>
</body>
</html>
