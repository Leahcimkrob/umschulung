<!DOCTYPE html>
<html lang="de">
<head>
    <title>Mini-Netflix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='m70_mini_netflix.css') }}">
</head>
<body>
    <div class="container">
        <div style="position: relative;">
            <h1 style="text-align: center; margin: 0;">🎬 Mini-Netflix</h1>
            <a href="{{ url_for('logout') }}" class="logout-btn" title="Logout" style="position: absolute; right: 0; bottom: 0;">
                <span class="logout-icon" tabindex="0">🔒
                    <span class="logout-tooltip">Logout</span>
                </span>
            </a>
        </div>
        <a href="{{ url_for('show_movies') }}" class="btn">📜 Filmliste- und verwaltung</a>
        <a href="{{ url_for('profile') }}" class="btn">👤 Profil</a>
    <h3>Admin-Bereich</h3>
        {% if is_admin == 1 %}
            <a href="{{ url_for('add_movie') }}" class="btn">➕ Neuen Film hinzufügen</a>
            <a href="{{ url_for('edit_movie') }}" class="btn">✏️ Film bearbeiten/löschen</a>
            <a href="{{ url_for('rent_movie') }}" class="btn">📽️+ Film ausleihen</a>
            <a href="{{ url_for('return_movie') }}" class="btn">📽️- Filme zurückgeben</a>
            <a href="{{ url_for('users') }}" class="btn">👤 Kundenverwaltung</a>
        {% endif %}
        <form method="post" action="{{ url_for('logout') }}" style="margin-top: 12px;">
            <button type="submit" class="btn" style="background:#ff4081;">Abmelden</button>
        </form>
    </div>
</body>
</html>
