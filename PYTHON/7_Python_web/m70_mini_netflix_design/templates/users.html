<!DOCTYPE html>
<html lang="de">
<head>
    <title>Benutzerverwaltung</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='m70_mini_netflix.css') }}">
</head>
<body>
    <div class="container">
        <h2>Benutzerverwaltung</h2>
        {% if error %}<p style="color:#ff4081;">{{ error }}</p>{% endif %}
        <form method="post">
            <label for="username"><span class="small-star-red">★</span>Benutzername:</label><br>
            <input type="text" name="username" id="username" value="" required><br>
            <label for="password"><span class="small-star-red">★</span>Passwort:</label><br>
            <div style="position:relative; width:80%;">
                <input type="password" name="password" id="password" value="" required style="width:100%;">
                <button type="button" onclick="togglePassword()" style="position:absolute; right:5px; top:7px; background:none; border:none; color:#0affff; cursor:pointer; font-size:16px;">👁️</button>
            </div><br>
                    <div class="hint-filme">
            <span class="small-star-red">★</span>(Pflichtfelder, um Kunden anzulegen)
        </div>
            <button type="submit" class="btn">Benutzer anlegen</button>
        </form>
        <h3>Alle Benutzer</h3>
        <span class="hint-filme">(ZumBearbeiten, Kunde anklicken)</span>
        <table style="width:80%; margin-bottom:16px;">
            <thead>
                <tr>
                    <th style="text-align:left; padding:4px;">Kunde</th>
                    <th style="text-align:left; padding:4px;">Passwort</th>
                </tr>
            </thead>
            <tbody>
            {% for user in users %}
                <tr>
                    <td style="padding:4px;">
                        <a href="{{ url_for('edit_user', user_id=user[0]) }}" style="color:#1976d2; text-decoration:underline;">{{ user[1] }}</a>
                    </td>
                    <td style="padding:4px;">
                        <span id="pw-{{ user[0] }}">{{ '*' * user[2]|length }}</span>
                        <button type="button" onclick="toggleUserPassword({{ user[0] }}, '{{ user[2] }}')" style="background:none; border:none; color:#0affff; cursor:pointer; font-size:16px;">👁️</button>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('home') }}" class="btn">🏠 Home</a>
    </div>
    <script>
    function togglePassword() {
        var pw = document.getElementById('password');
        pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    function toggleUserPassword(id, pw) {
        var span = document.getElementById('pw-' + id);
        if (span.innerText.startsWith('*')) {
            span.innerText = pw;
        } else {
            span.innerText = '*'.repeat(pw.length);
        }
    }
    </script>
</body>
</html>
