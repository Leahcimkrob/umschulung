<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
  </head>
  <body>
    <h1>Benutzerliste</h1>
    <p>Anzahl: {{ users|length }} {{ name }}</p>
    <ul>
      {% for user in users %}
        <li>{{ user }}</li>
      {% endfor %}
    </ul>

    <!-- Button löst GET auf /toggle aus -->
    <form action="{{ url_for('toggle') }}">
      <button type="submit">
        Sichtbarkeit umschalten (aktuell: {{ 'sichtbar' if visible else 'versteckt' }})
      </button>
    </form>

    {% if visible %}
      <div style="margin-top:1rem; padding:.5rem; border:1px solid #ccc;">
        Dies ist ein vom Server ein-/ausgeblendeter Tag.
      </div>
    {% endif %}
  </body>
</html>
